[project]
name = "creche-backend"
version = "0.1.0"
description = "Backend do baseline SME-Rio Inscrição Creche: motor de classificação por criança + painel de convocação"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "duckdb>=1.1",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "pyarrow>=17",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
