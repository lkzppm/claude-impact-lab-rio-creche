# Lint do Python (backend + mensageria). Rodado no CI (.github/workflows/ci.yml) e localmente: `make lint`.
line-length = 120
target-version = "py312"
extend-exclude = [".venv", "out", "data"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    "E501",  # linhas longas: o código tem SQL e textos em português; o formatador não é imposto
    "B008",  # Depends(...) como default é o padrão do FastAPI
    "SIM108", # ternário nem sempre é mais legível
    "E702", "E731", "E741", "E402", "UP046",  # estilo: ponto e vírgula, lambda nomeada, nome curto, import tardio (fixtures)
]

[lint.per-file-ignores]
"backend/tests/*" = ["E402"]  # o teste de integração precisa configurar DATABASE_URL antes de importar o app
"backend/app/etl/*" = ["B905"]
