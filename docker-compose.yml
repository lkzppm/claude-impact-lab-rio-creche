services:
  db:
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-creche}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-creche}
      POSTGRES_DB: ${POSTGRES_DB:-creche}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-creche} -d ${POSTGRES_DB:-creche}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-creche}:${POSTGRES_PASSWORD:-creche}@db:5432/${POSTGRES_DB:-creche}
      DATA_DIR: /data
      OUT_DIR: /out
      CORS_ORIGINS: http://localhost:5173,http://localhost
    volumes:
      - ./data:/data:ro
      - ./out:/out
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
